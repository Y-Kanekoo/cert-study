# local-ci の設定（development-hub テンプレート v1・テスト標準の4段階、既存repo向け）。
# skip の段階は docs/TESTING.md のスキップ記録と合わせて、整備したら外す。
fail_fast: true
setup:
  - npm ci --no-audit --no-fund
jobs:
  lint:
    kind: lint
    stage: static
    run: "npm run lint"
  typecheck:
    kind: typecheck
    stage: static
    run: "npm run typecheck"
    skip: true
    skip_reason: "package.json に typecheck がない（追加したら skip を外す）"
  secrets:
    kind: lint
    stage: static
    run: "node scripts/scan-secrets.mjs"
  unit:
    kind: test
    stage: unit
    run: "npm run test"
  api:
    kind: api
    stage: api
    run: "npm run test:api"
    skip: true
    skip_reason: "package.json に test:api がない（追加したら skip を外す）"
  e2e:
    kind: e2e
    stage: e2e
    # e2e/server.ts は dist/ のビルド結果を読み込むので、先に build する（npm run e2e と同じ順）。
    run: ["npm run build", "npx playwright test --grep @smoke"]
include_auto: false
