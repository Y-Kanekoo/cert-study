name = "cert-study"
main = "dist/fe/worker.js"
no_bundle = true
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "cert-study"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[vars]
TOKEN_SHA256 = ""

